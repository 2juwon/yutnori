<title>한판 윷놀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeon+Sung&family=Gowun+Dodum&display=swap">
<style>
/* 멍석 위에 한지 윷판을 펼친 한 화면 — 위: 차례 띠, 가운데: 윷판, 아래: 던지는 자리 */
:root{
  --mat:#cdb57a; --mat-2:#b89c5c; --mat-line:rgba(90,64,20,.18);
  --paper:#f4ecd8; --paper-edge:#d8c8a2; --ink:#2c2118; --ink-soft:#6b5a45;
  --panel:#fbf6ea; --panel-line:#e2d5b6;
  --hong:#c8372d; --cheong:#2a5aa6; --hwang:#d9a114; --heuk:#2b2622;
  --accent:#c8372d; --ok:#2f7d4f; --wood:#b07a3c; --wood-2:#8a5a28; --belly:#f0dcb0;
  --shadow:0 2px 0 rgba(60,40,10,.25), 0 8px 24px rgba(60,40,10,.18);
  --f-display:"Yeon Sung","Gowun Dodum",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mat:#2a2017; --mat-2:#1f1811; --mat-line:rgba(255,220,160,.06);
  --paper:#e9dcbd; --paper-edge:#b9a57c; --ink:#2c2118; --ink-soft:#6b5a45;
  --panel:#2f251c; --panel-line:#46382a;
  --accent:#e0574a; --ok:#5fb383; --belly:#ead4a4; --heuk:#7a6d60;
  --shadow:0 2px 0 rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --mat:#2a2017; --mat-2:#1f1811; --mat-line:rgba(255,220,160,.06);
  --paper:#e9dcbd; --paper-edge:#b9a57c; --ink:#2c2118; --ink-soft:#6b5a45;
  --panel:#2f251c; --panel-line:#46382a;
  --accent:#e0574a; --ok:#5fb383; --belly:#ead4a4; --heuk:#7a6d60;
  --shadow:0 2px 0 rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark}
:root{--fg:#2c2118; --fg-soft:#5d4b36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fg:#f1e6cf; --fg-soft:#bba98c}}
:root[data-theme="dark"]{--fg:#f1e6cf; --fg-soft:#bba98c}

html,body{height:100%}
body{
  background:var(--mat); color:var(--fg); font-family:var(--f-body); font-size:15px;
  background-image:
    repeating-linear-gradient(90deg, var(--mat-line) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(0deg, transparent 0 13px, var(--mat-line) 13px 15px);
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hwang); outline-offset:2px}
.app{
  min-height:100%; display:grid; grid-template-rows:auto auto 1fr auto; gap:10px;
  padding-block:10px 14px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  max-width:1100px; margin:0 auto; box-sizing:border-box;
}
/* 위 막대 */
.top{display:flex; align-items:center; gap:10px}
.logo{font-family:var(--f-display); font-size:26px; letter-spacing:.02em; line-height:1}
.logo small{white-space:nowrap; font-family:var(--f-body); font-size:12px; color:var(--fg-soft); margin-left:6px; letter-spacing:0}
.top .sp{flex:1}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--panel-line); background:var(--panel); display:grid; place-items:center; box-shadow:0 1px 0 rgba(0,0,0,.08)}
.iconbtn svg{width:20px; height:20px; stroke:var(--fg); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* 편 목록 */
.teams{display:grid; grid-template-columns:repeat(var(--n,2), minmax(0,1fr)); gap:8px}
.team{background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:8px 10px; display:grid; grid-template-columns:auto 1fr; gap:2px 8px; align-items:center; position:relative; transition:transform .2s, box-shadow .2s}
.team .chip{grid-row:span 2; width:26px; height:26px; border-radius:50%; background:var(--c); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 0 0 0 2px var(--panel); display:grid; place-items:center; color:#fff; font-family:var(--f-display); font-size:14px}
.team .nm{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.team .nm i{font-style:normal; font-weight:400; font-size:11px; color:var(--fg-soft); margin-left:4px}
.team .dots{display:flex; gap:3px; align-items:center; min-height:12px}
.team .dots b{width:9px; height:9px; border-radius:50%; background:var(--c); opacity:.9}
.team .dots b.board{opacity:.35}
.team .dots b.done{background:none; border:2px solid var(--c); width:5px; height:5px; opacity:1}
.team.on{box-shadow:0 0 0 2px var(--c), var(--shadow); transform:translateY(-2px)}
.team.won::after{content:"승"; position:absolute; right:8px; top:6px; font-family:var(--f-display); color:var(--c); font-size:18px}

/* 가운데: 윷판 + 오른쪽(넓은 화면) 패널 */
.main{display:grid; gap:12px; align-items:start; align-content:start; justify-items:center; min-height:0}
@media (min-width:860px){ .main{grid-template-columns:minmax(0,1fr) 340px; justify-items:stretch} }
.boardwrap{width:min(100%, calc(100vh - 330px), 640px); min-width:min(100%, 300px); aspect-ratio:1; position:relative; justify-self:center}
@media (min-width:860px){ .boardwrap{width:min(100%, calc(100vh - 150px), 680px)} }
.board{width:100%; height:100%; display:block; filter:drop-shadow(0 10px 18px rgba(50,30,5,.28))}
.board .paper{fill:var(--paper); stroke:var(--paper-edge); stroke-width:.6}
.board .ln{stroke:var(--ink); stroke-width:.55; stroke-linecap:round; opacity:.8; fill:none}
.board .nd{fill:var(--paper); stroke:var(--ink); stroke-width:.55}
.board .nd.big{stroke-width:.7}
.board .nd-in{fill:none; stroke:var(--ink); stroke-width:.35}
.board .lab{font-family:var(--f-display); font-size:2.6px; fill:var(--ink-soft); text-anchor:middle; pointer-events:none}
.board .lab.big{font-size:3.2px; fill:var(--hong)}
.board .start{font-family:var(--f-display); font-size:3px; fill:var(--hong)}
.ring{fill:none; stroke:var(--ok); stroke-width:.8; stroke-dasharray:1.6 1.1; cursor:pointer; animation:spin 4s linear infinite; transform-box:fill-box; transform-origin:center}
.ring.catch{stroke:var(--hong); stroke-width:1}
.ringhit{fill:transparent; cursor:pointer}
.ringtag{font-family:var(--f-display); font-size:3px; fill:var(--ok); text-anchor:middle; pointer-events:none}
.ringtag.catch{fill:var(--hong)}
@keyframes spin{to{transform:rotate(360deg)}}
.tok{transition:transform .17s ease-in-out; cursor:default}
.tok.mv{cursor:pointer}
.tok .body{stroke:rgba(0,0,0,.35); stroke-width:.4}
.tok .shine{fill:rgba(255,255,255,.35)}
.tok .ch{font-family:var(--f-display); font-size:3.6px; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.tok .badge{fill:var(--ink)}
.tok .bt{font-size:2.6px; fill:#fff; text-anchor:middle; dominant-baseline:central; font-weight:700; pointer-events:none}
.tok.mv .halo{opacity:1}
.tok .halo{opacity:0; fill:none; stroke:var(--hwang); stroke-width:.9; animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{stroke-opacity:.35} to{stroke-opacity:1}}
.tok.gone{opacity:0; pointer-events:none}
.burst{pointer-events:none}

/* 아래: 던지는 자리 */
.side{display:grid; gap:10px; width:100%; min-width:0}
.say{background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; min-height:44px}
.say .who{width:12px; height:12px; border-radius:50%; background:var(--c, var(--fg-soft)); flex:none}
.say .txt{flex:1; min-width:0; font-size:15px}
.say .txt b{font-weight:700}
.tray{display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-items:center}
.tray .lab{font-size:12px; color:var(--fg-soft)}
.rchip{min-width:52px; height:44px; padding:0 12px; border-radius:22px; border:2px solid var(--panel-line); background:var(--panel); font-family:var(--f-display); font-size:22px; line-height:1; display:inline-flex; align-items:center; gap:6px; justify-content:center}
.rchip small{font-family:var(--f-body); font-size:11px; color:var(--fg-soft)}
.rchip.sel{border-color:var(--ok); box-shadow:0 0 0 2px var(--ok) inset}
.rchip.back{color:var(--hong)}
.rchip:disabled{opacity:.45; cursor:default}
.newp{height:44px; border-radius:12px; border:1px dashed var(--fg-soft); background:transparent; padding:0 12px; font-size:14px; display:none; align-items:center; gap:6px}
.newp.show{display:inline-flex}
.newp .dot{width:14px; height:14px; border-radius:50%; background:var(--c)}

.throwzone{position:relative; background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:12px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; overflow:hidden}
.sticks{display:flex; gap:9px; justify-content:center; height:92px; align-items:center; perspective:400px}
.stick{width:22px; height:84px; border-radius:11px; position:relative; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.stick .f{position:absolute; inset:0; border-radius:11px; backface-visibility:hidden}
.stick .belly{background:linear-gradient(90deg,#e8cf9c,var(--belly) 40%,#e6cb95); box-shadow:inset 0 0 0 1px rgba(90,55,20,.35); display:flex; flex-direction:column; align-items:center; justify-content:space-evenly}
.stick .belly i{display:block; width:10px; height:10px; position:relative}
.stick .belly i::before,.stick .belly i::after{content:""; position:absolute; left:50%; top:0; width:2px; height:10px; background:#7a4a1c; transform:translateX(-50%) rotate(45deg)}
.stick .belly i::after{transform:translateX(-50%) rotate(-45deg)}
.stick .belly .bk{font-family:var(--f-display); color:var(--hong); font-size:13px; line-height:1}
.stick .back{background:linear-gradient(90deg,var(--wood-2),var(--wood) 35%,#c8904d 55%,var(--wood-2)); transform:rotateY(180deg); box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.stick .back::after{content:""; position:absolute; inset:10px 7px; border-radius:6px; background:repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 6px)}
.stick.down{transform:rotateY(180deg)}
.stick.toss{animation:toss .7s cubic-bezier(.3,.6,.4,1) both}
.stick.out{transform:translate(160px,-40px) rotate(70deg); opacity:.2}
@keyframes toss{0%{transform:translateY(0) rotateX(0)} 40%{transform:translateY(-70px) rotateX(540deg) rotateZ(20deg)} 100%{transform:translateY(0) rotateX(1080deg)}}
.throw{height:84px; min-width:110px; border-radius:16px; border:0; background:var(--hong); color:#fff; font-family:var(--f-display); font-size:26px; box-shadow:inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 rgba(0,0,0,.15); padding:0 14px; line-height:1.05}
.throw small{display:block; font-family:var(--f-body); font-size:11px; opacity:.85; margin-top:4px}
.throw:disabled{background:var(--panel-line); color:var(--fg-soft); box-shadow:none; cursor:default}
.throw:not(:disabled):active{transform:translateY(2px)}
.call{position:absolute; left:0; right:120px; top:50%; text-align:center; font-family:var(--f-display); font-size:54px; color:var(--hong); transform:translateY(-50%) scale(.4); opacity:0; pointer-events:none; text-shadow:0 2px 0 var(--panel), 0 0 14px var(--panel)}
.call.show{animation:call 1.1s ease-out both}
@keyframes call{0%{opacity:0; transform:translateY(-50%) scale(.4)} 20%{opacity:1; transform:translateY(-50%) scale(1.15)} 70%{opacity:1; transform:translateY(-50%) scale(1)} 100%{opacity:0; transform:translateY(-60%) scale(1)}}
.hint{font-size:12px; color:var(--fg-soft); line-height:1.5}
@media (max-width:480px){ .logo small{display:none} }
@media (max-width:420px){ .stick{width:19px; height:74px} .sticks{height:82px; gap:7px} .throw{height:74px; min-width:96px; font-size:23px} .call{right:100px} }

/* 시트(설정·규칙·끝) */
.veil{position:fixed; inset:0; background:rgba(25,15,5,.55); display:grid; place-items:center; padding:16px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); z-index:20; overflow:auto}
.sheet{background:var(--panel); color:var(--fg); border-radius:20px; width:min(560px,100%); max-height:calc(100% - 8px); overflow:auto; box-shadow:var(--shadow); padding:20px 18px; box-sizing:border-box}
.sheet h2{font-family:var(--f-display); font-weight:400; font-size:30px; margin:0 0 4px; text-wrap:balance}
.sheet h3{font-size:13px; letter-spacing:.06em; color:var(--fg-soft); margin:18px 0 8px; font-weight:700}
.sheet p{line-height:1.6; margin:6px 0}
.sheet .lead{color:var(--fg-soft); margin-bottom:6px}
.seats{display:grid; gap:8px}
.seat{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center}
.seat .chip{width:30px; height:30px; border-radius:50%; background:var(--c); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.seat input{width:100%; min-width:0; box-sizing:border-box; height:40px; border-radius:10px; border:1px solid var(--panel-line); background:var(--paper); color:#2c2118; padding:0 10px; font:inherit}
.seat select,.opt select{height:40px; border-radius:10px; border:1px solid var(--panel-line); background:var(--panel); color:var(--fg); font:inherit; padding:0 8px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{height:40px; min-width:52px; padding:0 12px; border-radius:10px; border:1px solid var(--panel-line); background:transparent}
.seg button.on{background:var(--fg); color:var(--panel); border-color:var(--fg)}
.opt{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:9px 0; border-top:1px dashed var(--panel-line)}
.opt .d{font-size:12px; color:var(--fg-soft); grid-column:1}
.sw{width:50px; height:30px; border-radius:15px; border:0; background:var(--panel-line); position:relative; grid-row:span 2}
.sw::after{content:""; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.opt select{grid-row:span 2}
.btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.btn{white-space:nowrap; height:48px; padding:0 18px; border-radius:14px; border:1px solid var(--panel-line); background:transparent; font-size:16px}
.btn.main{background:var(--hong); color:#fff; border:0; font-family:var(--f-display); font-size:22px; flex:1; box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.rules li{margin:5px 0; line-height:1.55}
.rules b{font-family:var(--f-display); font-weight:400; font-size:18px; color:var(--hong)}
.ptab{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px}
.ptab td,.ptab th{padding:6px 4px; border-bottom:1px dashed var(--panel-line); text-align:left}
.ptab th{font-weight:400; color:var(--fg-soft); font-size:12px}
.ptab td:first-child{font-family:var(--f-display); font-size:20px}
.win h2{font-size:44px; color:var(--c)}
.rank{display:grid; gap:6px; margin-top:10px}
.rank div{display:flex; gap:8px; align-items:center}
.rank i{width:14px; height:14px; border-radius:50%; background:var(--c); display:inline-block}
#fx{position:fixed; inset:0; pointer-events:none; z-index:30; width:100%; height:100%}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--panel); padding:10px 16px; border-radius:12px; font-size:14px; z-index:40; opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100% - 40px)}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .tok{transition:none} .stick.toss{animation:none} .ring{animation:none} .call.show{animation-duration:.01s} }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="logo">한판 윷놀이<small>도·개·걸·윷·모</small></div>
    <div class="sp"></div>
    <button class="iconbtn" id="bRules" aria-label="규칙 보기"><svg viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h5"/></svg></button>
    <button class="iconbtn" id="bSound" aria-label="소리 켜고 끄기"><svg viewBox="0 0 24 24" id="sndIco"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <button class="iconbtn" id="bMenu" aria-label="새 게임과 설정"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="teams" id="teams"></div>
  <div class="main">
    <div class="boardwrap"><svg class="board" id="board" viewBox="-4 -4 108 108" aria-label="윷판"></svg></div>
    <div class="side">
      <div class="say" id="say"><span class="who"></span><span class="txt">윷판을 펼치는 중…</span></div>
      <div class="tray" id="tray"></div>
      <div class="throwzone">
        <div class="sticks" id="sticks"></div>
        <button class="throw" id="bThrow">던지기<small>스페이스 키</small></button>
        <div class="call" id="call"></div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<div id="sheets"></div>

<script>/*ENGINE*/</script>
<script>/*AI*/</script>
<script>
(function(){
'use strict';
var Y = window.YUT, AI = window.YAI;
var $ = function(id){ return document.getElementById(id); };
var KEY = 'yut-hanpan-v1';
var COLORS = ['var(--hong)','var(--cheong)','var(--hwang)','var(--heuk)'];
var ANIMAL = ['말','소','양','돼지'];
var LEVEL_NAME = { easy:'느긋한 컴퓨터', normal:'보통 컴퓨터', hard:'고수 컴퓨터' };

// ── 저장 ──
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
var store = load();
store.setup = store.setup || { n:2, seats:[
  {name:'말', who:'human'}, {name:'소', who:'normal'}, {name:'양', who:'normal'}, {name:'돼지', who:'normal'} ], cfg:{} };
if (store.sound === undefined) store.sound = true;

// ── 난수 ──
function rnd(){ try{ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }catch(e){ return Math.random(); } }

// ── 말판 좌표 ──
var POS = (function(){
  var P = {}, lo = 8, hi = 92, st = (hi - lo) / 5;
  P[0] = [hi, hi];
  for (var k = 1; k <= 5; k++) P[k] = [hi, hi - st*k];          // 오른쪽 위로
  for (k = 1; k <= 5; k++) P[5+k] = [hi - st*k, lo];             // 위쪽 왼쪽으로
  for (k = 1; k <= 5; k++) P[10+k] = [lo, lo + st*k];            // 왼쪽 아래로
  for (k = 1; k <= 4; k++) P[15+k] = [lo + st*k, hi];            // 아래쪽 오른쪽으로
  function lerp(a, b, t){ return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t]; }
  var dg = [20,21,22,23,24]; dg.forEach(function(n,i){ P[n] = lerp(P[5], P[15], (i+1)/6); });
  [25,26].forEach(function(n,i){ P[n] = lerp(P[10], P[0], (i+1)/6); });
  [27,28].forEach(function(n,i){ P[n] = lerp(P[10], P[0], (i+4)/6); });
  P.done = [hi + 1, hi + 9];
  return P;
})();
var BIG = {0:1, 5:1, 10:1, 15:1, 22:1};
var SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

var board = $('board'), gRings, gToks, gFx;
function drawBoard(){
  board.innerHTML = '';
  el('rect', {x:-1, y:-1, width:102, height:102, rx:3, class:'paper'}, board);
  // 선
  var L = function(a, b){ el('line', {x1:POS[a][0], y1:POS[a][1], x2:POS[b][0], y2:POS[b][1], class:'ln'}, board); };
  L(0,5); L(5,10); L(10,15); L(15,0); L(5,15); L(10,0);
  // 칸
  for (var n = 0; n <= 28; n++){
    var p = POS[n], big = BIG[n];

    seg('sP', [[2,'2개'],[3,'3개'],[4,'4개'],[5,'5개']], cfg.pieces, function(v){ cfg.pieces = v; draw(); });
    seg('sProb', [['half','반반'],['real','진짜 윷']], cfg.prob, function(v){ cfg.prob = v; draw(); });
    var seats = sh.querySelector('#sSeats'); seats.innerHTML = '';
    for (var i = 0; i < su.n; i++) (function(i){
      var row = document.createElement('div'); row.className = 'seat'; row.style.setProperty('--c', COLORS[i]);
      row.innerHTML = '<span class="chip"></span><input id="seatName' + i + '" maxlength="8" aria-label="' + (i+1) + '번 편 이름"><select id="seatWho' + i + '" aria-label="누가 두나"><option value="human">사람</option><option value="easy">느긋한 컴퓨터</option><option value="normal">보통 컴퓨터</option><option value="hard">고수 컴퓨터</option></select>';
      var inp = row.querySelector('input'), selw = row.querySelector('select');
      inp.value = su.seats[i].name; selw.value = su.seats[i].who;
      inp.oninput = function(){ su.seats[i].name = inp.value; };
      selw.onchange = function(){ su.seats[i].who = selw.value; };
      seats.appendChild(row);
    })(i);
    var ob = sh.querySelector('#sOpts'); ob.innerHTML = '';
    OPTS.forEach(function(o){
      var on = !!cfg[o.k], r = document.createElement('div'); r.className = 'opt';
      r.innerHTML = '<span>' + o.t + '</span><button class="sw' + (on ? ' on' : '') + '" role="switch" aria-checked="' + on + '" aria-label="' + o.t + '"></button><span class="d">' + o.d + '</span>';
      r.querySelector('button').onclick = function(){ cfg[o.k] = on ? (o.on ? 0 : false) : (o.on || true); draw(); };
      ob.appendChild(r);
    });
  }
  draw();
  var c = sh.querySelector('#sCancel'); if (c) c.onclick = closeSheet;
  sh.querySelector('#sGo').onclick = function(){
    su.cfg = cfg; store.setup = su; save();
    startGame(); closeSheet();
  };
}

function startGame(){
  var su = store.setup, teams = [];
  for (var i = 0; i < su.n; i++){
    var s = su.seats[i];
    teams.push({ name:(s.name || ANIMAL[i]).trim() || ANIMAL[i], color:i, ai: s.who === 'human' ? null : s.who });
  }
  G = Y.newGame(teams, su.cfg, Math.floor(rnd() * teams.length));
  sel = 0; busy = false;
  buildToks(); persist(); render();
  toast(G.teams[G.turn].name + ' 편이 먼저 던져요');
  tick();
}

function persist(){ store.game = G; save(); }

function rulesSheet(){
  var D = AI.dist(G ? G.cfg : Y.DEFAULT_CFG), rows = '';
  [['도','배 1 · 등 3',1],['개','배 2 · 등 2',2],['걸','배 3 · 등 1',3],['윷','배 4',4],['모','등 4',5],['빽도','표시된 윷가락만 배',-1]].forEach(function(r){
    if (D[r[2]] === undefined) return;
    rows += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + (r[2] < 0 ? '뒤로 1' : '앞으로 ' + r[2]) + '</td><td>' + (D[r[2]]*100).toFixed(1) + '%</td></tr>';
  });
  var sh = openSheet('<h2>윷놀이 규칙</h2>' +
    '<table class="ptab"><tr><th>이름</th><th>윷가락</th><th>칸</th><th>확률</th></tr>' + rows + '</table>' +
    '<ul class="rules">' +
    '<li><b>한 번 더</b> 윷이나 모가 나오거나, 상대 말을 잡으면 한 번 더 던져요.</li>' +
    '<li><b>잡기</b> 상대 말이 있는 칸에 멈추면 그 말은 처음으로 돌아가요. 업힌 말도 모두.</li>' +
    '<li><b>업기</b> 내 말이 있는 칸에 멈추면 함께 업혀서 같이 움직여요.</li>' +
    '<li><b>지름길</b> 모·뒷모 모서리나 가운데 방에 <u>멈추면</u> 안쪽 길로 꺾어요. 지나가기만 하면 곧게 가요.</li>' +
    '<li><b>나기</b> 판을 돌아 참먹이를 지나가면 나요. 모든 말이 먼저 나는 편이 이겨요.</li>' +
    '<li><b>빽도</b> 왔던 길로 한 칸 물러나요. 도 자리에서 빽도면 참먹이로 가고, 그다음엔 무엇이 나와도 나요.</li>' +
    '</ul><p class="hint">규칙은 나무위키 「윷놀이」 문서를 따랐고, 지역마다 다른 부분은 새 게임 설정에서 고를 수 있어요.</p>' +
    '<div class="btns"><button class="btn main" id="rOk">알겠어요</button></div>');
  sh.querySelector('#rOk').onclick = closeSheet;
}

function menuSheet(){
  var sh = openSheet('<h2>메뉴</h2><div class="btns" style="flex-direction:column">' +
    '<button class="btn main" id="mNew">새 게임 (설정)</button>' +
    '<button class="btn" id="mAgain">같은 설정으로 다시</button>' +
    '<button class="btn" id="mClose">계속하기</button></div>');
  sh.querySelector('#mNew').onclick = function(){ setupSheet(false); };
  sh.querySelector('#mAgain').onclick = function(){ closeSheet(); startGame(); };
  sh.querySelector('#mClose').onclick = closeSheet;
}

function win(){
  snd('win'); confetti();
  var w = G.winner, sh = openSheet('<h2>' + esc(G.teams[w].name) + ' 편 승리!</h2>' +
    '<p class="lead">말 ' + G.cfg.pieces + '개를 모두 냈어요.</p><div class="rank" id="wRank"></div>' +
    '<div class="btns"><button class="btn" id="wSet">설정 바꾸기</button><button class="btn main" id="wAgain">한 판 더</button></div>', 'win');
  sh.style.setProperty('--c', teamColor(w));
  var rk = sh.querySelector('#wRank');
  G.teams.map(function(tm, t){ return { t:t, d:Y.stats(G, t).done, r:G.pieces[t].reduce(function(s,p){ return s + Y.remaining(p.node, p.prev); }, 0) }; })
    .sort(function(a, b){ return a.r - b.r; })
    .forEach(function(x, i){ var d = document.createElement('div'); d.style.setProperty('--c', teamColor(x.t)); d.innerHTML = '<i></i>' + (i+1) + '등 · ' + esc(G.teams[x.t].name) + ' <span class="hint">(남 ' + x.d + '개, 남은 칸 ' + x.r + ')</span>'; rk.appendChild(d); });
  sh.querySelector('#wAgain').onclick = function(){ closeSheet(); startGame(); };
  sh.querySelector('#wSet').onclick = function(){ setupSheet(false); };
}

// ── 이벤트 ──
$('bThrow').addEventListener('click', function(){ audio(); if (isHuman()) doThrow(); });
$('bRules').onclick = rulesSheet;
$('bMenu').onclick = menuSheet;
$('bSound').onclick = function(){ store.sound = !store.sound; save(); soundIcon(); if (store.sound) snd('turn'); };
document.addEventListener('keydown', function(e){
  if (sheetOpen()) { if (e.key === 'Escape' && G) closeSheet(); return; }
  if (e.code === 'Space' && isHuman() && G.phase === 'throw' && !busy){ e.preventDefault(); doThrow(); }
  if (/^[1-9]$/.test(e.key) && isHuman() && G.phase === 'move'){ var i = +e.key - 1; if (i < G.pending.length && (G.cfg.freeOrder || i === 0)){ sel = i; render(); } }
});

// ── 시작 ──
drawBoard(); buildSticks(); soundIcon();
window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function(){ return {}; });
if (store.game && store.game.v === 1 && store.game.phase !== 'over'){
  G = store.game; busy = false; buildToks(); render(); tick();
} else {
  // 처음 열면 예시 판(컴퓨터 둘이 두는 걸 보여 주지 않고, 바로 설정)
  G = Y.newGame([{name:'말',color:0,ai:null},{name:'소',color:1,ai:'normal'}], {});
  buildToks(); render();
  setupSheet(true);
}
window.__yut = { get G(){ return G; }, set speed(v){ SPEED = v; }, startGame:startGame, doThrow:doThrow, doMove:doMove, Y:Y };
})();
</script>
